<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Live2D - Voice & Chat</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b2b2b 0%, #1a1a1a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        canvas {
            display: block;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s;
            text-align: center;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* --- UI Overlay --- */
        .ui-layer {
            position: absolute;
            z-index: 100;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas where no UI exists */
        }

        .interactive-btn {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: white;
            font-size: 24px;
        }

        .interactive-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .interactive-btn:active {
            transform: scale(0.95);
        }

        /* Top Right Settings */
        #settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        /* Bottom Bar */
        #bottom-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: auto;
            
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        #chat-input {
            background: transparent;
            border: none;
            color: white;
            flex-grow: 1;
            font-size: 16px;
            outline: none;
            padding: 5px;
        }

        #chat-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        #mic-btn.listening {
            background: #ef4444;
            animation: pulse 1.5s infinite;
            border-color: #ef4444;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* --- Settings Modal --- */
        #settings-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 200;
            pointer-events: auto;
            align-items: center;
            justify-content: center;
        }

        #settings-content {
            background: #2a2a2a;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #444;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            color: white;
        }

        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box; /* Fix padding issues */
        }
        .form-group input:focus { outline: 1px solid #666; }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-cancel { background: transparent; color: #aaa; }
        .btn-cancel:hover { color: white; background: rgba(255,255,255,0.05); }
        
        .btn-save { background: #3b82f6; color: white; }
        .btn-save:hover { background: #2563eb; }

        /* Status Toast */
        #status-toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
    
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.8/browser/pixi.min.js"></script>
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/index.min.js"></script>
</head>
<body>

    <div id="loading">Initializing...</div>

    <!-- UI Overlay -->
    <div class="ui-layer">
        <!-- Status Toast -->
        <div id="status-toast">Ready</div>

        <!-- Settings Button -->
        <div id="settings-btn" class="interactive-btn" onclick="openSettings()">
            <i class="ph ph-gear"></i>
        </div>

        <!-- Bottom Chat Bar -->
        <div id="bottom-bar">
            <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
            <div id="mic-btn" class="interactive-btn" style="width: 40px; height: 40px; font-size: 20px;">
                <i class="ph ph-microphone"></i>
            </div>
            <div id="send-btn" class="interactive-btn" style="width: 40px; height: 40px; font-size: 20px; background: rgba(59, 130, 246, 0.5);">
                <i class="ph ph-paper-plane-right"></i>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal">
        <div id="settings-content">
            <h2>Settings</h2>
            <div class="form-group">
                <label>API Endpoint (OpenAI Compatible)</label>
                <input type="text" id="api-url" placeholder="https://.../v1/chat/completions">
            </div>
            <div class="form-group">
                <label>Model ID</label>
                <input type="text" id="model-id" placeholder="LiquidAI/LFM2.5-Audio-1.5B">
            </div>
            <div class="form-group">
                <label>System Prompt</label>
                <textarea id="system-prompt" rows="3" placeholder="You are a helpful assistant..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-save" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <!-- Canvas -->
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <script>
        // --- Configuration & State ---
        const DEFAULT_MODEL_URL = "https://ha466.github.io/bill/modal2/iris.model3.json";
        
        let settings = {
            apiUrl: localStorage.getItem('l2d_api_url') || 'http://localhost:8000/v1/chat/completions',
            modelId: localStorage.getItem('l2d_model_id') || 'LiquidAI/LFM2.5-Audio-1.5B',
            systemPrompt: localStorage.getItem('l2d_system_prompt') || 'You are a helpful, witty anime character.'
        };

        // --- Live2D Setup ---
        window.PIXI = PIXI; 
        const { Live2DModel } = PIXI.live2d;
        let app;
        let currentModel = null;
        let lipSyncTimer = null; // Timer for random mouth movement
        let isSpeaking = false;

        async function initLive2D() {
            const loadingDiv = document.getElementById('loading');

            app = new PIXI.Application({
                view: document.getElementById('canvas'),
                autoStart: true,
                resizeTo: window,
                backgroundAlpha: 0,
                antialias: true
            });

            try {
                currentModel = await Live2DModel.from(DEFAULT_MODEL_URL);
            } catch (error) {
                console.error("Failed to load model:", error);
                loadingDiv.innerText = "Error loading model.";
                return;
            }

            app.stage.addChild(currentModel);
            
            // Layout Logic
            resizeModel();
            window.addEventListener('resize', resizeModel);

            // Interaction
            currentModel.interactive = true;
            setupDragging(currentModel);

            loadingDiv.style.opacity = 0;
        }

        function resizeModel() {
            if (!currentModel) return;
            const scaleX = (window.innerWidth * 0.4) / currentModel.width;
            const scaleY = (window.innerHeight * 0.8) / currentModel.height;
            const scale = Math.min(scaleX, scaleY);
            currentModel.scale.set(scale);
            currentModel.x = window.innerWidth / 2;
            currentModel.y = window.innerHeight / 2;
            currentModel.anchor.set(0.5, 0.5);
        }

        function setupDragging(model) {
            model.on('pointerdown', (e) => {
                model.dragging = true;
                model._dragData = e.data;
                model._dragOffset = { x: model.x - e.data.global.x, y: model.y - e.data.global.y };
            });
            model.on('pointerup', () => { model.dragging = false; });
            model.on('pointerupoutside', () => { model.dragging = false; });
            model.on('pointermove', () => {
                if (model.dragging) {
                    const newPos = model._dragData.global;
                    model.x = newPos.x + model._dragOffset.x;
                    model.y = newPos.y + model._dragOffset.y;
                }
            });
        }

        // --- Lip Sync Logic ---
        // Since getting real audio data from SpeechSynthesis is hard, we simulate lip sync
        // by modulating the parameter while the browser reports it is speaking.
        function startLipSync() {
            if (lipSyncTimer) clearInterval(lipSyncTimer);
            isSpeaking = true;
            
            lipSyncTimer = setInterval(() => {
                if (!currentModel || !isSpeaking) return;
                
                // Random value between 0.0 and 1.0 to simulate talking
                // A simple sine wave or random noise works well enough for "fake" sync
                const value = Math.random(); 
                
                // Try setting parameter for Cubism 3/4
                try {
                    currentModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', value);
                } catch (e) {
                    // Fallback for Cubism 2 or different naming convention
                    try {
                        currentModel.internalModel.coreModel.setParamFloat('PARAM_MOUTH_OPEN_Y', value);
                    } catch (e2) {}
                }
            }, 100); // Update every 100ms
        }

        function stopLipSync() {
            isSpeaking = false;
            if (lipSyncTimer) clearInterval(lipSyncTimer);
            lipSyncTimer = null;

            // Close mouth
            if (currentModel) {
                 try {
                    currentModel.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', 0);
                } catch (e) {
                     try {
                        currentModel.internalModel.coreModel.setParamFloat('PARAM_MOUTH_OPEN_Y', 0);
                    } catch (e2) {}
                }
            }
        }

        // --- TTS Logic ---
        function speakText(text) {
            if (!text) return;
            
            // Stop any current speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            
            // Optional: Select a voice (Preferably female for Iris model)
            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha'));
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.onstart = () => {
                startLipSync();
            };

            utterance.onend = () => {
                stopLipSync();
            };

            utterance.onerror = () => {
                stopLipSync();
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- API Integration ---
        async function sendToLLM(userText) {
            showToast("Thinking...");
            
            // Check for common configuration errors
            if (settings.apiUrl.includes('localhost') || settings.apiUrl.includes('127.0.0.1')) {
                showToast("Error: Localhost not supported");
                speakText("I cannot reach your local computer from here. Please use a public URL like Ngrok.");
                return;
            }

            try {
                const response = await fetch(settings.apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: settings.modelId,
                        messages: [
                            { role: "system", content: settings.systemPrompt },
                            { role: "user", content: userText }
                        ],
                        temperature: 0.7,
                        max_tokens: 256
                    })
                });

                if (!response.ok) throw new Error(`API Error: ${response.status}`);

                const data = await response.json();
                const aiText = data.choices[0].message.content;
                
                showToast("Speaking...");
                speakText(aiText);

            } catch (error) {
                console.error(error);
                if (error.name === 'TypeError' && error.message === 'Failed to fetch') {
                    showToast("Connection Failed: Check CORS/URL");
                    speakText("I can't connect. Please check your settings and make sure CORS is enabled in Colab.");
                } else {
                    showToast("Error: Check API Settings");
                    speakText("Something went wrong with the connection.");
                }
            }
        }

        // --- Voice Input (STT) ---
        const micBtn = document.getElementById('mic-btn');
        let recognition;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                micBtn.classList.add('listening');
                showToast("Listening...");
            };

            recognition.onend = () => {
                micBtn.classList.remove('listening');
                // Don't clear toast yet
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('chat-input').value = transcript;
                sendToLLM(transcript); // Auto-send on voice
            };
            
            recognition.onerror = (event) => {
                micBtn.classList.remove('listening');
                console.error("Speech Recog Error", event.error);
                showToast("Voice Error");
            };
        } else {
            micBtn.style.display = 'none'; // Hide if not supported
            console.log("Web Speech API not supported");
        }

        micBtn.addEventListener('click', () => {
            if (micBtn.classList.contains('listening')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // --- UI Interactions ---
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsModal = document.getElementById('settings-modal');

        // Chat Send
        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;
            chatInput.value = '';
            sendToLLM(text);
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Settings Modal
        window.openSettings = () => {
            document.getElementById('api-url').value = settings.apiUrl;
            document.getElementById('model-id').value = settings.modelId;
            document.getElementById('system-prompt').value = settings.systemPrompt;
            settingsModal.style.display = 'flex';
        };

        window.closeSettings = () => {
            settingsModal.style.display = 'none';
        };

        window.saveSettings = () => {
            settings.apiUrl = document.getElementById('api-url').value.trim();
            settings.modelId = document.getElementById('model-id').value.trim();
            settings.systemPrompt = document.getElementById('system-prompt').value.trim();
            
            localStorage.setItem('l2d_api_url', settings.apiUrl);
            localStorage.setItem('l2d_model_id', settings.modelId);
            localStorage.setItem('l2d_system_prompt', settings.systemPrompt);
            
            closeSettings();
            showToast("Settings Saved");
        };

        function showToast(msg) {
            const toast = document.getElementById('status-toast');
            toast.innerText = msg;
            toast.style.opacity = 1;
            setTimeout(() => { toast.style.opacity = 0; }, 3000);
        }

        // Initialize
        initLive2D();

    </script>
</body>
</html>
